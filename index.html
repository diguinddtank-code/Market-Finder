<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soccer Academy Market Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'],
            },
            colors: {
              neon: {
                400: '#a3ff00', // Lime/Soccer Green
                500: '#84cc16',
                glow: '#39ff14',
              },
              dark: {
                900: '#020617', // Deep space
                800: '#0f172a', // Slate dark
                card: 'rgba(30, 41, 59, 0.7)', // Glass
              }
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px)",
              'futuristic-gradient': "radial-gradient(circle at center, #1e1b4b 0%, #020617 100%)",
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.5' },
              },
              scanVertical: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { transform: 'translateY(500%)', opacity: '0' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.7s ease-out forwards',
              'slide-up': 'slideUp 0.7s ease-out forwards',
              'pulse-slow': 'pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan-field': 'scanVertical 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #020617;
        background-image: radial-gradient(circle at 50% 0%, #172554 0%, #020617 70%);
        color: #e2e8f0;
        min-height: 100vh;
      }
      .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .neon-glow {
        box-shadow: 0 0 10px rgba(163, 255, 0, 0.3);
      }
      .text-neon {
        color: #a3ff00;
        text-shadow: 0 0 5px rgba(163, 255, 0, 0.5);
      }
      /* Tactical Grid Background for the specific element */
      .tactical-grid {
        background-size: 20px 20px;
        background-image: 
          linear-gradient(to right, rgba(163, 255, 0, 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(163, 255, 0, 0.1) 1px, transparent 1px);
      }
      /* Utility to ensure animations fill correctly */
      .fill-forwards {
        animation-fill-mode: forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
